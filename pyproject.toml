[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "skateid"
version = "0.3.0"
description = "Flatground skateboard trick recognition (2026 stack)"
readme = "README.md"
requires-python = ">=3.10"
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Image Recognition",
]
dependencies = [
    "numpy>=1.24",
    "pandas>=2.0",
    "opencv-python-headless>=4.8",
    "fastapi>=0.110",
    "uvicorn>=0.28",
    "scikit-learn>=1.4",
    # Used by `skateid fetch --dataset skateai` to pull clips from the BATB sources.
    "yt-dlp>=2025.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]
deeplearning = [
    # M1 runs on the RTX 3060, so torch comes from the CUDA index, not PyPI:
    #   pip install --index-url https://download.pytorch.org/whl/cu128 \
    #       torch==2.11.0+cu128 torchvision==0.26.0+cu128
    # 2.11 is the newest CUDA 12.8 build the index publishes; the PyPI CPU wheel
    # is 2.14, so enabling CUDA is a *downgrade*. The >=2.6 floor below still
    # holds, but `skateid doctor` should report which build is actually loaded,
    # because a CPU wheel here is silent -- it just runs everything ~20x slower
    # and the scores still come out, looking like a modelling result.
    "torch>=2.6",
    "torchvision>=0.21",
    "ultralytics>=8.3",
    # B1's strongest frozen-embedder backend (`skateid baselines --b1
    # --embedder videomae`). Pinned <5 deliberately: VideoMAE's checkpoint uses
    # legacy '{0...11}' state-dict keys that torch 2.x no longer expands, so
    # transformers 5.x silently leaves the attention biases randomly initialised
    # and the "frozen" encoder is partly noise. VideoMAEEmbedder asserts a
    # complete load, so this pin failing is a loud error, not a wrong score.
    # The weaker torchvision backends work without transformers at all.
    "transformers>=4.44,<5",
]

[project.scripts]
skateid = "skateid.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["skateid*"]
exclude = ["data*", "checkpoints*", "tests*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-p no:cacheprovider"

